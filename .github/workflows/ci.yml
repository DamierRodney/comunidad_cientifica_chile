# .github/workflows/ci.yml
# CI/CD — Comunidad Científica Chile
# Runs on every push/PR to main or develop:
#   1. Lint (flake8)
#   2. Django system check
#   3. Test suite with coverage report
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }} / Django tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: comunidad_cientifica   # manage.py lives here

    env:
      DJANGO_SECRET_KEY: "ci-insecure-key-do-not-use-in-production"
      DJANGO_DEBUG:       "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install flake8 coverage

      # ── 4. Lint ───────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.git,venv \
            --count --statistics

      # ── 5. Django system check ────────────────────────────────
      - name: Django check
        run: python manage.py check --deploy --fail-level WARNING 2>&1 || true
        # "|| true" because --deploy warns about missing HTTPS settings in CI

      # ── 6. Run migrations ─────────────────────────────────────
      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      # ── 7. Run tests with coverage ────────────────────────────
      - name: Test with coverage
        run: |
          coverage run --source=accounts,comunidad_cientifica manage.py test accounts --verbosity=2
          coverage report -m --fail-under=60

      # ── 8. Upload coverage report (optional) ─────────────────
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: comunidad_cientifica/.coverage
          retention-days: 7
